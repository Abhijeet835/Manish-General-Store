########################################################
# app.conf — virtual host / server block
# Place at: /etc/nginx/conf.d/app.conf
#
# Prerequisites:
#   • Obtain TLS certificates (e.g. Let's Encrypt / certbot)
#   • Update `server_name` to your actual domain
#   • Adjust upstream `api` address if needed
########################################################

########################################################
# Upstream — Node.js API
########################################################
upstream api_backend {
    server            api:5000;
    keepalive         32;           # Persistent connections to upstream
}

########################################################
# 1. HTTP → HTTPS redirect (port 80)
########################################################
server {
    listen      80;
    listen      [::]:80;
    server_name example.com www.example.com;

    # Allow Let's Encrypt ACME challenge through before redirecting
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

########################################################
# 2. HTTPS server (port 443)
########################################################
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name example.com www.example.com;

    ##############################################################
    # TLS configuration
    ##############################################################
    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    # Modern cipher suite (TLS 1.2 minimum; TLS 1.3 preferred)
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;   # Let client pick with TLS 1.3

    # OCSP stapling — reduces handshake latency
    ssl_stapling        on;
    ssl_stapling_verify on;
    resolver            1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout    5s;

    ##############################################################
    # Security headers
    # See: https://securityheaders.com
    ##############################################################
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options           "DENY" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;

    # Content Security Policy — tighten per your app's actual requirements
    # Remove 'unsafe-inline' once you move to nonce-based scripts
    add_header Content-Security-Policy
        "default-src 'self'; \
         script-src  'self' 'unsafe-inline'; \
         style-src   'self' 'unsafe-inline'; \
         img-src     'self' data: https:; \
         font-src    'self'; \
         connect-src 'self'; \
         frame-ancestors 'none'; \
         base-uri    'self'; \
         form-action 'self';" always;

    ##############################################################
    # Logging
    ##############################################################
    access_log /var/log/nginx/app_access.log main;
    error_log  /var/log/nginx/app_error.log  warn;

    ##############################################################
    # Root / document settings
    ##############################################################
    root  /usr/share/nginx/html;
    index index.html;

    ##############################################################
    # 3. Static asset serving (frontend)
    ##############################################################
    location / {
        # Apply general rate limit (burst of 20 with no delay)
        limit_req zone=general burst=20 nodelay;

        try_files $uri $uri/ /index.html;   # SPA fallback

        # Long cache for hashed/versioned filenames (e.g. main.abc123.js)
        location ~* \.(js|css|woff2?|ttf|eot|svg|ico|png|jpg|jpeg|webp|gif)$ {
            expires     1y;
            add_header  Cache-Control "public, immutable";
            access_log  off;            # Skip logging for static assets
        }

        # Short cache for HTML (so new deploys are picked up quickly)
        location ~* \.html?$ {
            expires     1h;
            add_header  Cache-Control "public, must-revalidate";
        }
    }

    ##############################################################
    # 4. API proxy to Node.js
    ##############################################################
    location /api/ {
        # Stricter rate limit for API calls
        limit_req zone=api burst=50 nodelay;

        proxy_pass         http://api_backend;
        proxy_http_version 1.1;

        # Required for upstream keep-alive
        proxy_set_header   Connection        "";

        # Pass real client info to the app
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeouts (tune to your API's response characteristics)
        proxy_connect_timeout  5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        # Disable buffering for streaming/SSE responses; enable for normal APIs
        proxy_buffering          on;
        proxy_buffer_size        4k;
        proxy_buffers            8 8k;
        proxy_busy_buffers_size  16k;

        # Don't expose upstream errors verbatim
        proxy_intercept_errors on;
    }

    ##############################################################
    # 5. Health check endpoint (for load balancers / uptime checks)
    ##############################################################
    location = /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    ##############################################################
    # 6. Block common attack vectors
    ##############################################################
    # Deny hidden files (e.g. .env, .git, .htaccess)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny PHP execution attempts (common scanner probe)
    location ~ \.php$ {
        deny all;
    }

    ##############################################################
    # 7. Custom error pages
    ##############################################################
    error_page 400 401 403 404 /404.html;
    error_page 429                /429.html;
    error_page 500 502 503 504  /50x.html;

    location = /404.html { root /usr/share/nginx/html; internal; }
    location = /429.html { root /usr/share/nginx/html; internal; }
    location = /50x.html { root /usr/share/nginx/html; internal; }
}