########################################################
# nginx.conf — global / http-level settings
# Place at: /etc/nginx/nginx.conf
########################################################

user  nginx;

# One worker per CPU core; auto-detect
worker_processes  auto;

# Raise the per-process file-descriptor ceiling
# (must be >= worker_connections * worker_processes)
worker_rlimit_nofile 65535;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;   # max simultaneous connections per worker
    multi_accept        on;     # accept all pending connections at once
    use                 epoll;  # Linux kernel event model (most efficient)
}

http {
    ##################################################################
    # Basic
    ##################################################################
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;          # Hide nginx version from Server header

    sendfile        on;         # Use kernel sendfile() for static files
    tcp_nopush      on;         # Batch TCP packets (works with sendfile)
    tcp_nodelay     on;         # Reduce latency for keep-alive connections

    keepalive_timeout  65;
    keepalive_requests 1000;

    client_max_body_size        16m;    # Max upload size; adjust to your needs
    client_body_timeout         12s;
    client_header_timeout       12s;
    send_timeout                10s;

    ##################################################################
    # Logging
    ##################################################################
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time uct="$upstream_connect_time" '
                      'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log  /var/log/nginx/access.log  main;

    ##################################################################
    # Gzip compression
    ##################################################################
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;         # 1–9; 5 is a good speed/size balance
    gzip_min_length   256;       # Don't compress tiny responses
    gzip_buffers      16 8k;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml
        font/woff
        font/woff2;

    ##################################################################
    # Rate limiting — define zones here, apply them in server blocks
    ##################################################################
    # General zone: 10 req/s per IP, 10 MB state store
    limit_req_zone  $binary_remote_addr  zone=general:10m  rate=10r/s;

    # Stricter zone for auth/sensitive endpoints
    limit_req_zone  $binary_remote_addr  zone=api:10m      rate=30r/s;

    limit_req_status  429;       # Return "Too Many Requests" (not 503)

    ##################################################################
    # SSL session cache shared across workers
    ##################################################################
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;     # Forward-secrecy: disable ticket reuse

    ##################################################################
    # Include all virtual-host configs
    ##################################################################
    include /etc/nginx/conf.d/*.conf;
}